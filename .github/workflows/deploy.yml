name: Deploy FOCO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run lint
      - name: ExerciseDB contract tests
        run: npm run test:edb
      - name: Training science tests
        run: npm run test:training-science
      - name: Session persistence contract
        run: npm run test:session-contract
      - name: UI/UX regression tests
        run: npm run test:ui-ux
      - name: Build production site
        env:
          # Public FOCO is a free beta during 2026 only. Remove this flag before
          # any monetization; the default for other environments is DISABLED.
          VITE_FOCO_EXERCISEDB_NONCOMMERCIAL_BETA: 'true'
          VITE_FOCO_COMMERCIAL_MODE: 'false'
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  clear-stale-pages:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Cancel competing automatic Pages workflows
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, per_page: 100
            });
            const conflicts = data.workflow_runs.filter(run =>
              run.name === 'pages build and deployment' &&
              ['queued', 'waiting', 'pending', 'in_progress', 'requested'].includes(run.status)
            );
            for (const run of conflicts) {
              try {
                core.info(`Cancelling competing Pages run #${run.id} (${run.status})`);
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
              } catch (error) {
                core.warning(`Could not cancel run #${run.id}: ${error.message}`);
              }
            }
            // A cancelled workflow may still have a Pages deployment releasing its lock.
            for (let attempt = 0; attempt < 30; attempt++) {
              const { data: current } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, per_page: 100
              });
              const busy = current.workflow_runs.some(run =>
                run.name === 'pages build and deployment' &&
                ['queued', 'waiting', 'pending', 'in_progress', 'requested'].includes(run.status)
              );
              if (!busy) return;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.warning('An automatic Pages run is still active; deployment may need a later rerun.');

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, clear-stale-pages]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
