name: Validate FOCO TypeScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript validation
        run: npm run lint
      - name: Production frontend build
        run: npm run build
      - name: Scientific workout generation rules and safety regression
        run: npm run test:training-science
      - name: Exercise image catalog audit
        run: npm run audit:images
      - name: Anatomy atlas manifest integrity
        run: npm run audit:anatomy
      - name: Safe ZIP review preview importer
        run: npm run test:anatomy-review
      - name: Public review assets integrity
        run: npm run audit:anatomy-review-public
      - name: Validate prompts for entire exercise catalog (non-billable)
        run: npm run anatomy:generate -- --max-images=254
      - name: Export the 254 exercise-specific anatomy prompts
        uses: actions/upload-artifact@v4
        with:
          name: foco-anatomy-254-prompts
          path: anatomy-generation-plan.json
          if-no-files-found: error
