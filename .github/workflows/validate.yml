name: Validate FOCO TypeScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Production frontend build
        run: npm run build
      - name: Scientific workout generation rules and safety regression
        run: npm run test:training-science
      - name: OKOK assessment trends and data-integrity regression
        run: npm run test:okok
      - name: Premium UI navigation and accessibility regression
        run: npm run test:ui-ux
      - name: Motion design accessibility and navigation regression
        run: npm run test:motion
      - name: FOCO PRO product design and beta readiness guardrails
        run: npm run test:pro-quality
      - name: FOCO 2.0 interaction, skill and data-truth regression
        run: npm run test:v2
      - name: FOCO 2.2 training scale and PWA freshness guardrails
        run: npm run test:session-contract
      - name: RepDB licensed imagery and stable exercise IDs
        run: npm run test:repdb
      - name: RepDB Exercise Atlas pagination and gallery regression
        run: npm run test:atlas
      - name: Exercise image catalog audit
        run: npm run audit:images
      - name: Anatomy atlas manifest integrity
        run: npm run audit:anatomy
      - name: Safe ZIP review preview importer
        run: npm run test:anatomy-review
      - name: Public review assets integrity
        run: npm run audit:anatomy-review-public
      - name: Validate prompts for entire exercise catalog (non-billable)
        run: npm run anatomy:generate -- --max-images=254
      - name: Export the 254 exercise-specific anatomy prompts
        uses: actions/upload-artifact@v4
        with:
          name: foco-anatomy-254-prompts
          path: anatomy-generation-plan.json
          if-no-files-found: error

  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Typecheck published Edge Function
        run: deno check --no-lock --node-modules-dir=none supabase/functions/foco-api/index.ts
      - name: Authentication, session replay and password security
        run: |
          npm run test:auth-reliability
          npm run test:session-replay
          npm run test:password-security
          npm run test:edge-reliability
      - name: PostgreSQL rollback, RLS and concurrent transaction regression
        run: npm run test:backend-transactions
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Build production frontend
        run: npm run build
      - name: Start isolated frontend preview
        run: |
          mkdir -p work
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > work/preview.log 2>&1 &
          node --input-type=module -e 'for(let n=0;n<60;n++){try{const r=await fetch("http://127.0.0.1:4173/FOCO/");if(r.ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,250))}process.exit(1)'
      - name: Browser accessibility, failure recovery and preserved auth forms
        run: npm run test:audit-browser
      - name: Lost response, reload and storage-quota session regression
        run: npm run test:session-retry-browser
      - name: Upload synthetic regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foco-audit-regressions
          path: work/
          if-no-files-found: warn
