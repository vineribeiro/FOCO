name: One-time ExerciseDB media diagnosis
on:
  push:
    paths:
      - .github/workflows/diagnose-edb-once.yml
permissions:
  contents: read
jobs:
  check-live-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe the user-reported incline dumbbell press without downloading media
        run: |
          node --input-type=module <<'NODE'
          const terms = ['dumbbell incline bench press', 'incline dumbbell bench press'];
          for (const term of terms) {
            const url = 'https://oss.exercisedb.dev/api/v1/exercises/search?search=' + encodeURIComponent(term);
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 12000);
            try {
              const response = await fetch(url, { signal: ctrl.signal, headers: { Accept: 'application/json' } });
              const data = await response.json().catch(() => null);
              console.log(JSON.stringify({
                term, status: response.status, cors: response.headers.get('access-control-allow-origin'),
                count: Array.isArray(data?.data) ? data.data.length : null,
                matches: Array.isArray(data?.data) ? data.data.slice(0, 20).map(x => ({name:x.name, id:x.exerciseId, gifUrl:x.gifUrl})) : [],
                errors: data?.message || data?.error || null,
              }));
              if (response.status === 429) break;
            } catch (err) { console.log(JSON.stringify({term,error:String(err)})); }
            finally { clearTimeout(timer); }
            await new Promise(resolve => setTimeout(resolve, 1800));
          }
          NODE
