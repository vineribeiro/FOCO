<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
<title id="title">Leg press 45 graus — ilustração FOCO</title>
<desc id="desc">Ilustração esquemática de atleta reclinado no leg press inclinado, com pés na plataforma, joelhos semiflexionados e braços junto ao assento. Não substitui orientação profissional.</desc>
<defs>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#737F76"/><stop offset=".25" stop-color="#313D36"/><stop offset=".67" stop-color="#151E1B"/><stop offset="1" stop-color="#7C8C7F"/></linearGradient>
  <linearGradient id="rail" x1="0" y1="0" x2=".95" y2=".8"><stop stop-color="#A3B0A3"/><stop offset=".36" stop-color="#24322A"/><stop offset=".74" stop-color="#7D9380"/><stop offset="1" stop-color="#111913"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D7BB8E"/><stop offset=".49" stop-color="#967957"/><stop offset="1" stop-color="#634E38"/></linearGradient>
  <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4F5B4E"/><stop offset=".43" stop-color="#1D2821"/><stop offset="1" stop-color="#080F0A"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B5EB35"/><stop offset="1" stop-color="#D4FF52"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#B5EF49" stop-opacity=".27"/><stop offset="1" stop-color="#B5EF49" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <pattern id="grip" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 3 4 0M6 12 12 6" stroke="#738070" stroke-width="1" opacity=".3"/></pattern>
</defs>
<!-- dark studio glow behind the athlete -->
<ellipse cx="407" cy="234" rx="283" ry="195" fill="url(#glow)"/>
<ellipse cx="345" cy="409" rx="295" ry="23" fill="#000" opacity=".48" filter="url(#shadow)"/>
<!-- frame and 45-degree guides -->
<path d="M62 410H649" stroke="#070E0A" stroke-width="30" stroke-linecap="round"/>
