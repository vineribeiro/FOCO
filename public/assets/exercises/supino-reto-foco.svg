<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="title desc">
<title id="title">Supino reto com barra — ilustração FOCO</title>
<desc id="desc">Ilustração esquemática de atleta deitado em banco reto, segurando barra com pesos. Guia visual ilustrativo, não substitui orientação profissional.</desc>
<defs>
 <linearGradient id="steel" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#9AAE9D"/><stop offset=".27" stop-color="#2B4033"/><stop offset=".62" stop-color="#101D14"/><stop offset="1" stop-color="#7C9882"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#E1C092"/><stop offset=".6" stop-color="#9A7857"/><stop offset="1" stop-color="#664834"/></linearGradient>
 <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#445C46"/><stop offset=".6" stop-color="#1C3023"/><stop offset="1" stop-color="#0A110C"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#D0F65A" stop-opacity=".24"/><stop offset="1" stop-color="#D0F65A" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="11"/></filter>
</defs>
<ellipse cx="378" cy="229" rx="290" ry="188" fill="url(#glow)"/>
