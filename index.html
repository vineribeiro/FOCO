<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FOCO | Fitness Premium</title>
    <meta name="description" content="FOCO — Treinos personalizados por inteligência artificial, análise de fichas e acompanhamento da evolução." />
    <meta property="og:title" content="FOCO | Fitness Premium" />
    <meta property="og:description" content="FOCO — Foco em evoluir com um plano de treino alinhado aos seus objetivos." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/FOCO/manifest.webmanifest" />
    <link rel="preload" href="/FOCO/assets/brand/foco-v6-reference-vector.svg" as="image" />
    <link rel="apple-touch-icon" sizes="180x180" href="/FOCO/icons/foco-180.png" />
    <meta name="theme-color" content="#080A07" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FOCO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/FOCO/icons/foco.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html,body{margin:0;min-height:100%;background:#080A07;color:#F6F7F1}
      .boot-screen{box-sizing:border-box;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:15px;padding:36px 24px 7vh;text-align:center;position:relative;isolation:isolate;overflow:hidden;font-family:Poppins,Arial,sans-serif;background:#080A07}
      .boot-screen:before{content:"";position:absolute;z-index:-2;inset:0;background:linear-gradient(0deg,#050805 4%,rgba(5,8,5,.74) 28%,transparent 76%),url('https://images.unsplash.com/photo-1613845205719-8c87760ab728?auto=format&fit=crop&w=1000&q=82') center 28%/cover}
      .boot-screen:after{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse at 86% 76%,rgba(213,255,64,.17),transparent 56%)}
      .boot-logo{display:block;width:min(64vw,245px);height:auto;filter:drop-shadow(0 8px 20px rgba(0,0,0,.2))}
      .boot-text{color:#F3F5EB;font-size:9px;font-weight:700;letter-spacing:.19em;text-transform:uppercase}
      .boot-track{width:108px;height:3px;margin-top:auto;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.25)}
      .boot-track:after{content:"";display:block;height:100%;width:55%;background:#D5FF40;border-radius:99px;animation:bootPulse 1.1s ease-in-out infinite alternate}
      @keyframes bootPulse{from{transform:translateX(-48%)}to{transform:translateX(120%)}}
      @media(prefers-reduced-motion:reduce){.boot-track:after{animation:none}}
    </style>
  </head>
  <body class="bg-black text-white antialiased selection:bg-[#D5FF40] selection:text-black">
    <div id="root">
      <main class="boot-screen" role="status" aria-live="polite">
        <img class="boot-logo" src="/FOCO/assets/brand/foco-v6-reference-vector.svg" width="245" height="59" alt="FOCO" />
        <p class="boot-text">TREINO · EVOLUÇÃO · PERFORMANCE</p>
        <div class="boot-track" aria-hidden="true"></div>
      </main>
    </div>
    <noscript><p style="padding:24px;font-family:Arial,sans-serif">O FOCO precisa de JavaScript ativado para funcionar.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
